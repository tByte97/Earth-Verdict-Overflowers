<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
</head><body>
<title>Детектив планети</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Unbounded:wght@600;700&display=swap">
<style>
/* Layout: одна колонка-історія: справа → здогадка → докази → вердикт → перевірки → майбутнє */
:root{
  --bg:#eef2f6; --surface:#ffffff; --sunken:#e3e9ef; --fg:#16212c; --muted:#56687a; --line:#d2dbe4;
  --accent:#3a4fd0; --accent-soft:#e1e5fb;
  --ok:#23804f; --ok-soft:#dbf0e4; --bad:#c2412d; --bad-soft:#f8e1dc; --wait:#9a6c0c; --wait-soft:#f6ecd3;
  --display:"Unbounded",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1620; --surface:#18222e; --sunken:#121b25; --fg:#e6edf3; --muted:#97a8b8; --line:#273545;
  --accent:#8c9bff; --accent-soft:#232b55;
  --ok:#5fd18f; --ok-soft:#163324; --bad:#ff8a73; --bad-soft:#3b1d17; --wait:#f0c45a; --wait-soft:#33290f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1620; --surface:#18222e; --sunken:#121b25; --fg:#e6edf3; --muted:#97a8b8; --line:#273545;
  --accent:#8c9bff; --accent-soft:#232b55;
  --ok:#5fd18f; --ok-soft:#163324; --bad:#ff8a73; --bad-soft:#3b1d17; --wait:#f0c45a; --wait-soft:#33290f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:17px/1.55 var(--body);margin:0}
main{max-width:860px;margin:0 auto;padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
h1{font:700 26px/1.15 var(--display);margin:0;letter-spacing:-.01em}
h2{font:700 18px/1.25 var(--display);margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.score{font-weight:700;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.proto{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--wait)}
.files{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:620px){.files{grid-template-columns:minmax(0,1fr)}}
.file{text-align:left;cursor:pointer;background:var(--surface);color:var(--fg);border:2px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font:inherit;position:relative}
.file .no{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.file .q{font-weight:700;line-height:1.3}
.file .done{font-size:13px;font-weight:700}
.file[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.rumor{font:700 21px/1.3 var(--display);text-wrap:balance}
.step{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.guess{display:flex;flex-wrap:wrap;gap:8px}
.guess button{font:700 16px var(--body);cursor:pointer;border:2px solid var(--line);background:var(--sunken);color:var(--fg);border-radius:10px;padding:10px 16px}
.guess button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.linkbtn{background:none;border:none;color:var(--accent);font:600 15px var(--body);cursor:pointer;padding:0;text-decoration:underline}
.stripes{display:flex;height:64px;border-radius:8px;overflow:hidden}
.stripes div{flex:1 1 0}
.stripe-axis{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.legend{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend .ramp{width:120px;height:10px;border-radius:5px}
.plot{width:100%;min-width:0}
.thennow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.thennow{grid-template-columns:minmax(0,1fr)}}
.tn{background:var(--sunken);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column}
.tn b{font:700 22px var(--display);font-variant-numeric:tabular-nums}
.tn span{font-size:14px;color:var(--muted)}
.verdict{position:relative;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.stamp{align-self:flex-start;font:700 22px var(--display);text-transform:uppercase;letter-spacing:.04em;border:3px solid currentColor;border-radius:8px;padding:4px 12px;transform:rotate(-3deg)}
.v-confirmed{background:var(--ok-soft)} .v-confirmed .stamp{color:var(--ok)}
.v-refuted{background:var(--bad-soft)} .v-refuted .stamp{color:var(--bad)}
.v-not_proven{background:var(--wait-soft)} .v-not_proven .stamp{color:var(--wait)}
.locked{background:var(--sunken);border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.reaction{font-weight:800}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.checks li{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:start}
.mark{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:17px}
.mark.yes{background:var(--ok-soft);color:var(--ok)} .mark.no{background:var(--bad-soft);color:var(--bad)} .mark.na{background:var(--sunken);color:var(--muted)}
.checks b{display:block}
.ctl{display:flex;flex-direction:column;gap:6px}
.ctl label{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.ctl output{font-variant-numeric:tabular-nums;color:var(--accent)}
.ctl input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{font:700 15px var(--body);cursor:pointer;border:2px solid var(--line);background:var(--sunken);color:var(--fg);border-radius:10px;padding:8px 12px;flex:1 1 180px;text-align:left}
.seg button small{display:block;font-weight:600;color:var(--muted);font-size:13px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.future{font:700 20px/1.35 var(--display);text-wrap:balance}
.teacher{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.toggle{display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer;width:max-content;max-width:100%}
table{border-collapse:collapse;font-size:14px;width:100%}
td{padding:4px 0;border-bottom:1px solid var(--line)} td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.tablewrap{overflow-x:auto}
@media (prefers-reduced-motion:no-preference){.stamp{animation:pop .35s ease-out}@keyframes pop{from{transform:rotate(-3deg) scale(1.25);opacity:0}to{transform:rotate(-3deg) scale(1);opacity:1}}}
</style>

<main>
  <div class="top">
    <div><p class="proto">Прототип · штучні дані</p><h1>Детектив планети</h1></div>
    <span class="score" id="score">Розкрито справ: 0 з 3</span>
  </div>
  <p class="muted">Ти чуєш багато чуток про погоду й клімат. Обери справу, зроби здогадку і перевір її на даних супутників і метеостанцій.</p>

  <div class="files" id="files" role="group" aria-label="Справи"></div>

  <section class="card">
    <p class="step">Справа</p>
    <p class="rumor" id="rumor"></p>
    <p class="muted small" id="what"></p>
    <p class="step">Твоя здогадка</p>
    <div class="guess" id="guess" role="group" aria-label="Здогадка">
      <button data-g="true" aria-pressed="false">Правда</button>
      <button data-g="false" aria-pressed="false">Неправда</button>
      <button data-g="unknown" aria-pressed="false">Не знаю</button>
    </div>
  </section>

  <section class="card">
    <p class="step">Докази</p>
    <h2 id="ev-title"></h2>
    <div>
      <div class="stripes" id="stripes" role="img"></div>
      <div class="stripe-axis"><span>1981</span><span>2003</span><span>2025</span></div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="thennow" id="thennow"></div>
    <div id="plot" class="plot"></div>
  </section>

  <section id="verdict-slot"></section>

  <section class="card" id="checks-card">
    <p class="step">Як детектив це перевірив</p>
    <ul class="checks" id="checks"></ul>
    <div class="teacher">
      <label class="toggle" for="teach"><input id="teach" type="checkbox"> Показати числа для вчителя</label>
      <div class="tablewrap" id="teach-box" hidden><table id="teach-table"></table></div>
    </div>
  </section>

  <section class="card">
    <p class="step">А що далі?</p>
    <div class="ctl"><label for="born">Рік твого народження <output id="born-o"></output></label><input id="born" type="range" min="2007" max="2016" step="1" value="2011"></div>
    <div class="ctl"><label for="age">Коли тобі буде <output id="age-o"></output></label><input id="age" type="range" min="20" max="80" step="1" value="40"></div>
    <div class="seg" id="scen" role="group" aria-label="Що роблять люди">
      <button data-s="s1" aria-pressed="false">Світ різко скорочує викиди<small>сценарій SSP1-2.6</small></button>
      <button data-s="s2" aria-pressed="true">Приблизно як зараз<small>сценарій SSP2-4.5</small></button>
      <button data-s="s3" aria-pressed="false">Викиди ростуть далі<small>сценарій SSP5-8.5</small></button>
    </div>
    <p class="future" id="future"></p>
    <p class="muted small" id="future-note"></p>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.34.0/plotly-basic.min.js"></script>
<script>
const CASES={
  heat:{no:'Справа 1',rumor:'Кажуть, що літа в Києві стали спекотнішими',short:'Літа в Києві спекотнішають?',dir:1,
    what:'Перевіряємо середню температуру повітря за червень–серпень у Києві, 1981–2025.',noun:'літо',unit:'°C',dec:1,
    base:19.3,slope:0.045,sigma:0.75,phi:0.25,seed:11,stSeed:21,lowC:'#3b6fd1',highC:'#d6452f',lowL:'прохолодніше',highL:'спекотніше',anom:'abs',
    scen:{s1:[0.45,0.95,1.3,1.4,1.4],s2:[0.45,1.05,1.65,2.15,2.75],s3:[0.45,1.15,2.1,3.3,5.1]}},
  snow:{no:'Справа 2',rumor:'Кажуть, що в Карпатах тепер більше снігу',short:'Снігу в Карпатах більшає?',dir:1,
    what:'Перевіряємо середню глибину снігу за грудень–лютий у Карпатах, 1981–2025.',noun:'зима',unit:'см',dec:0,
    base:41,slope:-0.32,sigma:7,phi:0.3,seed:5,stSeed:15,lowC:'#a8743f',highC:'#4a8fd6',lowL:'мало снігу',highL:'багато снігу',anom:'pct',
    scen:{s1:[-12,-20,-27,-29,-30],s2:[-12,-22,-34,-44,-55],s3:[-12,-25,-44,-64,-85]}},
  rain:{no:'Справа 3',rumor:'Кажуть, що в Києві стає менше дощів',short:'Дощів у Києві меншає?',dir:-1,
    what:'Перевіряємо суму опадів за рік у Києві, 1981–2025.',noun:'рік',unit:'мм',dec:0,
    base:640,slope:-0.4,sigma:85,phi:0.1,seed:7,stSeed:17,lowC:'#c99a3b',highC:'#2f8f8a',lowL:'сухіше',highL:'дощовіше',anom:'pct',
    scen:{s1:[0,1,2,2,2],s2:[0,1,2,3,3.5],s3:[0,1,2.5,4,5.5]}}
};
const KN=[2015,2030,2050,2070,2100],Y0=1981,Y1=2025,NOW=2026;
const st={c:'heat',guess:{},revealed:{},teach:false,born:2011,age:40,s:'s2'};

function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function noise(seed,phi){const r=rng(seed),o=[];let e=0;for(let y=Y0;y<=Y1;y++){const u=Math.max(r(),1e-9),v=r(),z=Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);e=phi*e+Math.sqrt(1-phi*phi)*z;o.push(e)}return o}
function series(k,seed,extra=1){const n=noise(seed,k.phi),xs=[],ys=[];for(let y=Y0;y<=Y1;y++){let v=k.base+k.slope*(y-2003)+k.sigma*extra*n[y-Y0];if(k.unit!=='°C')v=Math.max(0,v);xs.push(y);ys.push(v)}return{xs,ys}}
const median=a=>{const s=[...a].sort((p,q)=>p-q),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
function erf(x){const t=1/(1+0.3275911*Math.abs(x)),y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);return x>=0?y:-y}
function analyze(xs,ys){const n=xs.length,sl=[];let S=0;for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){sl.push((ys[j]-ys[i])/(xs[j]-xs[i]));S+=Math.sign(ys[j]-ys[i])}
  sl.sort((a,b)=>a-b);const slope=median(sl),ic=median(ys.map((y,i)=>y-slope*xs[i])),res=ys.map((y,i)=>y-(ic+slope*xs[i])),mr=res.reduce((a,b)=>a+b,0)/n;
  let num=0,den=0;for(let i=0;i<n;i++){den+=(res[i]-mr)**2;if(i)num+=(res[i]-mr)*(res[i-1]-mr)}const r1=den?num/den:0;
  let v=n*(n-1)*(2*n+5)/18;if(r1>0)v*=(1+r1)/(1-r1);const z=S>0?(S-1)/Math.sqrt(v):S<0?(S+1)/Math.sqrt(v):0,p=2*(1-0.5*(1+erf(Math.abs(z)/Math.SQRT2)));
  const N=sl.length,C=1.96*Math.sqrt(v),lo=sl[Math.max(0,Math.round((N-C)/2)-1)],hi=sl[Math.min(N-1,Math.round((N+C)/2))];
  const sd=Math.sqrt(den/(n-1)),ph=Math.min(Math.max(r1,0),0.9),nStar=Math.abs(slope)<1e-12?Infinity:Math.pow((3.3*sd/Math.abs(slope))*Math.sqrt((1+ph)/(1-ph)),2/3);
  return{n,slope,ic,p,lo,hi,sd,r1,nStar}}
function robust(xs,ys){const s=xs[0],e=xs[xs.length-1];return[[s,e],[s+3,e],[s+6,e],[s,e-3],[s+3,e-3]].map(([a,b])=>{const i0=xs.indexOf(a),i1=xs.indexOf(b)+1,r=analyze(xs.slice(i0,i1),ys.slice(i0,i1));return r})}
function judge(k){const o=series(k,k.seed),r=analyze(o.xs,o.ys),rb=robust(o.xs,o.ys),same=rb.filter(w=>w.p<0.05&&Math.sign(w.slope)===Math.sign(r.slope)).length;
  const s=series(k,k.stSeed,1.3),w=analyze(s.xs,s.ys);
  const wAgree=w.p<0.05&&Math.sign(w.slope)===Math.sign(r.slope),wOpp=w.p<0.05&&Math.sign(w.slope)!==Math.sign(r.slope);
  let v='not_proven',reason='noise';
  if(r.p<0.05&&same>=4&&!wOpp){v=Math.sign(r.slope)===k.dir?'confirmed':'refuted';reason=v}
  else if(r.p<0.05&&wOpp)reason='disagree'; else if(r.p<0.05)reason='period';
  return{o,r,same,total:rb.length,s,w,wAgree,wOpp,v,reason}}

const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const hex2=h=>{const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]};
const lerp=(a,b,t)=>a.map((x,i)=>Math.round(x+(b[i]-x)*t));
function stripeColor(k,t){const mid=[236,236,236],lo=hex2(k.lowC),hi=hex2(k.highC);const c=t<0?lerp(mid,lo,Math.min(1,-t)):lerp(mid,hi,Math.min(1,t));return`rgb(${c})`}
const sgn=(v,d)=>(v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(d);
const interp=(vals,x)=>{if(x<=KN[0])return vals[0];for(let i=1;i<KN.length;i++)if(x<=KN[i]){const t=(x-KN[i-1])/(KN[i]-KN[i-1]);return vals[i-1]+t*(vals[i]-vals[i-1])}return vals[vals.length-1]};
function alpha(h,a){const[r,g,b]=hex2(h.length===4?'#'+h.slice(1).split('').map(x=>x+x).join(''):h);return`rgba(${r},${g},${b},${a})`}

function renderFiles(){document.getElementById('files').innerHTML=Object.entries(CASES).map(([id,k])=>{
  const j=judge(k),done=st.revealed[id],lab={confirmed:'Правда',refuted:'Неправда',not_proven:'Не доведено'}[j.v];
  return`<button class="file" data-c="${id}" aria-pressed="${id===st.c}"><span class="no">${k.no}</span><span class="q">${k.short}</span><span class="done" style="color:${done?css(j.v==='confirmed'?'--ok':j.v==='refuted'?'--bad':'--wait'):css('--muted')}">${done?'Розкрито: '+lab:'Не розкрито'}</span></button>`}).join('');
  document.querySelectorAll('.file').forEach(b=>b.onclick=()=>{st.c=b.dataset.c;render()});
  document.getElementById('score').textContent=`Розкрито справ: ${Object.keys(st.revealed).length} з 3`}

function render(){const k=CASES[st.c],j=judge(k),{o,r}=j;renderFiles();
  document.getElementById('rumor').textContent='«'+k.rumor+'»';document.getElementById('what').textContent=k.what;
  document.querySelectorAll('#guess button').forEach(b=>b.setAttribute('aria-pressed',String(st.guess[st.c]===b.dataset.g)));
  // докази
  const ref=o.ys.filter((_,i)=>o.xs[i]>=1991&&o.xs[i]<=2020),m=ref.reduce((a,b)=>a+b,0)/ref.length,amax=Math.max(...o.ys.map(y=>Math.abs(y-m)));
  document.getElementById('ev-title').textContent=`Кожна смужка — одне ${k.noun==='рік'?'рік':k.noun==='зима'?'зима':'літо'}, від 1981 до 2025`;
  const strip=document.getElementById('stripes');strip.innerHTML=o.ys.map((y,i)=>`<div title="${o.xs[i]}: ${y.toFixed(k.dec)} ${k.unit}" style="background:${stripeColor(k,(y-m)/amax)}"></div>`).join('');
  strip.setAttribute('aria-label',`Смужки для ${o.xs.length} років: колір показує, наскільки рік був ${k.highL} чи ${k.lowL} за звичайний`);
  document.getElementById('legend').innerHTML=`<span>${k.lowL}</span><span class="ramp" style="background:linear-gradient(90deg,${k.lowC},rgb(236,236,236),${k.highC})"></span><span>${k.highL}</span><span>· наведи на смужку, щоб побачити рік</span>`;
  const then=r.ic+r.slope*Y0,now=r.ic+r.slope*Y1,since=r.slope*(Y1-st.born);
  document.getElementById('thennow').innerHTML=`<div class="tn"><span>Звичайне ${k.noun} тоді (1981)</span><b>${then.toFixed(k.dec)} ${k.unit}</b></div>
    <div class="tn"><span>Звичайне ${k.noun} тепер (2025)</span><b>${now.toFixed(k.dec)} ${k.unit}</b></div>
    <div class="tn"><span>Зміна з року твого народження</span><b>${sgn(since,k.dec+(k.dec?0:0))} ${k.unit}</b></div>`;
  const fg=css('--fg'),mu=css('--muted'),li=css('--line');
  Plotly.react('plot',[{type:'bar',x:o.xs,y:o.ys,marker:{color:o.ys.map(y=>stripeColor(k,(y-m)/amax))},hovertemplate:'%{x}: %{y:.'+k.dec+'f} '+k.unit+'<extra></extra>'},
    {x:o.xs,y:o.xs.map(x=>r.ic+r.slope*x),mode:'lines',line:{color:fg,width:3},hoverinfo:'skip'}],
    {height:240,margin:{l:44,r:8,t:6,b:30},paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(0,0,0,0)',showlegend:false,bargap:0.15,
     font:{family:'Nunito, system-ui, sans-serif',size:13,color:fg},hoverlabel:{bgcolor:css('--surface'),bordercolor:li,font:{color:fg}},
     xaxis:{fixedrange:true,gridcolor:'rgba(0,0,0,0)',tickfont:{color:mu},linecolor:li},
     yaxis:{fixedrange:true,gridcolor:li,tickfont:{color:mu},zeroline:false,range:k.unit==='°C'?[Math.min(...o.ys)-0.5,Math.max(...o.ys)+0.5]:[0,Math.max(...o.ys)*1.08],title:{text:k.unit,font:{color:mu}}},
     annotations:[{x:2012,y:r.ic+r.slope*2012,text:'загальний напрямок',showarrow:true,ax:-30,ay:-30,arrowcolor:mu,font:{size:12,color:fg}}]},{displayModeBar:false,responsive:true});
  // вердикт
  const slot=document.getElementById('verdict-slot'),g=st.guess[st.c];
  if(!st.revealed[st.c]){slot.innerHTML=`<div class="locked"><b>Вердикт закрито</b><span class="muted">Зроби здогадку вище, щоб відкрити його.</span><button class="linkbtn" id="peek">Показати без здогадки</button></div>`;
    document.getElementById('peek').onclick=()=>{st.revealed[st.c]=true;render()}}
  else{const per10=sgn(r.slope*10,k.dec?k.dec:0),wait=Math.ceil(r.nStar-r.n),waitTxt=!isFinite(r.nStar)||wait>80?'дуже довго, десятки років':`ще приблизно ${wait} років — тобі тоді буде ${2025+wait-st.born}`;
    const text={confirmed:`Дані підтверджують чутку. Звичайне ${k.noun} змінилося приблизно на ${per10} ${k.unit} за кожні 10 років.`,
      refuted:`Насправді все навпаки: ${k.unit==='см'?'снігу меншає':'показник іде в інший бік'}, приблизно на ${per10} ${k.unit} за кожні 10 років.`,
      not_proven:`Може, ${k.dir<0?'дощів і меншає':'зміни і є'} трохи, але різниця між сусідніми роками набагато більша. Щоб сказати напевно, потрібно ${waitTxt}. «Не доведено» не означає «змін немає».`}[j.v];
    const stamp={confirmed:'Правда',refuted:'Неправда',not_proven:'Не доведено'}[j.v];
    const right=(g==='true'&&j.v==='confirmed')||(g==='false'&&j.v==='refuted')||(g==='unknown'&&j.v==='not_proven');
    const react=!g?'':right?'Твоя здогадка збіглася з даними.':'Несподівано? Саме тому чутки варто перевіряти.';
    slot.innerHTML=`<div class="verdict v-${j.v}"><span class="stamp">${stamp}</span><p>${text}</p>${react?`<p class="reaction">${react}</p>`:''}</div>`}
  // перевірки
  const C=[
    {ok:r.p<0.05,t:'Не схоже на випадковість',d:r.p<0.05?'Якби погода просто випадково коливалася без жодної зміни, такий нахил траплявся б рідше, ніж в одному випадку з 20.':'Такий нахил легко отримати й випадково, коли погода просто коливається.'},
    {ok:j.same>=4,t:'Тримається, хоч як обирай роки',d:`Перевірили ${j.total} різних періодів: однаковий висновок у ${j.same} з ${j.total}.`},
    {ok:j.wAgree?true:j.wOpp?false:null,t:'Метеостанція погоджується',d:j.wAgree?'Справжній термометр на землі показує те саме, що й супутникові дані.':j.wOpp?'Станція показує протилежне, тому вердикт обережніший.':'Станція не бачить чіткої зміни: її ряд коротший і шумніший.'}];
  document.getElementById('checks').innerHTML=C.map(c=>`<li><span class="mark ${c.ok===true?'yes':c.ok===false?'no':'na'}" aria-label="${c.ok===true?'так':c.ok===false?'ні':'немає даних'}">${c.ok===true?'✓':c.ok===false?'×':'–'}</span><span><b>${c.t}</b><span class="muted small">${c.d}</span></span></li>`).join('');
  document.getElementById('teach-box').hidden=!st.teach;
  document.getElementById('teach-table').innerHTML=[['Нахил Сена за 10 років',sgn(r.slope*10,k.dec+1)+' '+k.unit],['95% інтервал',sgn(r.lo*10,k.dec+1)+' … '+sgn(r.hi*10,k.dec+1)],
    ['p, Манн–Кендалл з поправкою',r.p<0.001?'< 0.001':r.p.toFixed(3)],['Автокореляція r₁',r.r1.toFixed(2)],['Стійкість до періоду',`${j.same} з ${j.total}`],
    ['Станція: нахил за 10 років, p',`${sgn(j.w.slope*10,k.dec+1)}, ${j.w.p<0.001?'< 0.001':j.w.p.toFixed(3)}`],['Років до виявлення (Weatherhead)',isFinite(r.nStar)?r.nStar.toFixed(0):'∞']]
    .map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join('');
  // майбутнє
  const yr=Math.min(2100,st.born+st.age);document.getElementById('born-o').textContent=st.born;document.getElementById('age-o').textContent=`${st.age} років · ${yr} рік`;
  document.querySelectorAll('#scen button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.s===st.s)));
  const d=interp(k.scen[st.s],yr),fut=k.anom==='abs'?m+d:m*(1+d/100);
  const ext=k.dir>0&&k.unit==='°C'?Math.max(...o.ys):k.unit==='см'?Math.min(...o.ys):null,extY=ext!==null?o.xs[o.ys.indexOf(ext)]:null;
  let near=0;o.ys.forEach((y,i)=>{if(Math.abs(y-fut)<Math.abs(o.ys[near]-fut))near=i});
  let line;
  if(k.unit==='°C') line=fut>ext?`Коли тобі буде ${st.age}, звичайне літо буде спекотнішим, ніж найспекотніше літо ${extY} року.`:`Коли тобі буде ${st.age}, звичайне літо буде схоже на літо ${o.xs[near]} року, одне з найспекотніших досі.`;
  else if(k.unit==='см') line=fut<ext?`Коли тобі буде ${st.age}, звичайна зима матиме менше снігу, ніж найбідніша на сніг зима ${extY} року.`:`Коли тобі буде ${st.age}, звичайна зима буде схожа на зиму ${o.xs[near]} року: приблизно ${fut.toFixed(0)} см снігу замість ${m.toFixed(0)} см зараз.`;
  else line=`Коли тобі буде ${st.age}, опадів буде приблизно на ${sgn(d,0)}% інакше, ніж зараз. Це менше, ніж звичайна різниця між двома сусідніми роками (близько ${(100*r.sd/m).toFixed(0)}%).`;
  document.getElementById('future').textContent=line;
  document.getElementById('future-note').textContent='Це сценарії кліматичних моделей, а не прогноз погоди. Який з них справдиться, залежить від того, що роблять люди. У прототипі криві стилізовані; у продукті тут будуть дані NASA NEX-GDDP-CMIP6.';
}

document.querySelectorAll('#guess button').forEach(b=>b.onclick=()=>{st.guess[st.c]=b.dataset.g;st.revealed[st.c]=true;render()});
document.getElementById('teach').onchange=e=>{st.teach=e.target.checked;render()};
document.getElementById('born').oninput=e=>{st.born=+e.target.value;render()};
document.getElementById('age').oninput=e=>{st.age=+e.target.value;render()};
document.querySelectorAll('#scen button').forEach(b=>b.onclick=()=>{st.s=b.dataset.s;render()});
const mq=matchMedia('(prefers-color-scheme: dark)');mq.addEventListener&&mq.addEventListener('change',render);
new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
window.Plotly?render():addEventListener('load',render);
</script>

</body></html>
