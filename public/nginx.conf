# Earth Verdict on myhaven.fun. TLS ends at the front proxy (192.168.0.40), which forwards plain HTTP here.
# nginx runs in the app container's network, so the app sees it as 127.0.0.1 and trusts the
# X-Forwarded-For it sets: one value, the visitor's address as the front proxy reported it.
server {
    listen 80 default_server;
    server_name _;

    set_real_ip_from 192.168.0.0/24;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ACME challenges keep working as before (same webroot the old site used).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 180s;
    }
}
